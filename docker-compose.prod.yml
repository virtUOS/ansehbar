# Production stack: PostgreSQL + Django (uvicorn/ASGI) + Caddy (TLS proxy).
# The app image (root Dockerfile) bakes in the built SPA; on start it copies
# the build into the frontend_data volume, which Caddy serves directly. OIDC
# points at the institutional IdP, so there is no Keycloak service here.
#
#   docker compose -f docker-compose.prod.yml pull            # run a released image
#   docker compose -f docker-compose.prod.yml up -d --no-build
#   docker compose -f docker-compose.prod.yml up -d --build   # or build from source
#
# Required env (in .env): PUBLIC_BASE_URL, ACME_EMAIL, DJANGO_SECRET_KEY,
# POSTGRES_PASSWORD, DJANGO_ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS and the OIDC_*
# vars — see .env.prod.example. Server guide: docs/deployment.md. Variables marked `:?` make compose refuse to start when
# they are missing, so a forgotten secret never silently falls back.

services:
  db:
    image: postgres:16-alpine
    container_name: ansehbar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ansehbar}
      POSTGRES_USER: ${POSTGRES_USER:-ansehbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ansehbar} -d ${POSTGRES_DB:-ansehbar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django/uvicorn plus the baked-in SPA build (see Dockerfile). `image:` lets
  # `pull` fetch a released tag directly; `build:` still works via
  # `up -d --build`. Set ANSEHBAR_VERSION to pin/roll back (release tag, with
  # or without the leading "v"); ANSEHBAR_IMAGE for another registry.
  app:
    image: ${ANSEHBAR_IMAGE:-ghcr.io/virtuos/ansehbar}:${ANSEHBAR_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansehbar_app
    restart: unless-stopped
    # Keep every continuation line at this indentation — YAML's folded (">")
    # scalar only joins same-indented lines with spaces.
    command: >
      sh -c "mkdir -p /shared_frontend &&
      cp -a /app/frontend_dist/. /shared_frontend/ &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips '*'"
    environment: &app-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
      # SPA and API share one origin in production — no CORS needed.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-ansehbar}
      POSTGRES_USER: ${POSTGRES_USER:-ansehbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Public URL of the instance (absolute links, OIDC redirects).
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      OIDC_LOGIN_REDIRECT_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}/
      OIDC_LOGOUT_REDIRECT_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}/
      OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID:?set OIDC_RP_CLIENT_ID}
      OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:?set OIDC_RP_CLIENT_SECRET}
      # Either set the issuer (endpoints via OIDC discovery) …
      OIDC_OP_ISSUER: ${OIDC_OP_ISSUER:-}
      # … or the endpoints explicitly (explicit values win).
      OIDC_OP_AUTHORIZATION_ENDPOINT: ${OIDC_OP_AUTHORIZATION_ENDPOINT:-}
      OIDC_OP_TOKEN_ENDPOINT: ${OIDC_OP_TOKEN_ENDPOINT:-}
      OIDC_OP_USER_ENDPOINT: ${OIDC_OP_USER_ENDPOINT:-}
      OIDC_OP_JWKS_ENDPOINT: ${OIDC_OP_JWKS_ENDPOINT:-}
      OIDC_OP_LOGOUT_ENDPOINT: ${OIDC_OP_LOGOUT_ENDPOINT:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
      ANSEHBAR_ACCESS_GROUP: ${ANSEHBAR_ACCESS_GROUP:-ansehbar-users}
      ANSEHBAR_BOOTSTRAP_USERS: ${ANSEHBAR_BOOTSTRAP_USERS:-}
      ANSEHBAR_ACCESS_CONTACT: ${ANSEHBAR_ACCESS_CONTACT:-}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-10}
      # Audio level measurement (ffmpeg) during events; 0 = off.
      AUDIO_MONITOR_ENABLED: ${AUDIO_MONITOR_ENABLED:-1}
      AUDIO_MAX_PARALLEL: ${AUDIO_MAX_PARALLEL:-4}
      AUDIO_SAMPLE_SECONDS: ${AUDIO_SAMPLE_SECONDS:-10}
      AUDIO_INTERVAL_SECONDS: ${AUDIO_INTERVAL_SECONDS:-30}
      OPENCAST_URL: ${OPENCAST_URL:-}
      OPENCAST_USER: ${OPENCAST_USER:-}
      OPENCAST_PASSWORD: ${OPENCAST_PASSWORD:-}
      OPENCAST_SYNC_SECONDS: ${OPENCAST_SYNC_SECONDS:-60}
      OPENCAST_LOOKAHEAD_DAYS: ${OPENCAST_LOOKAHEAD_DAYS:-7}
      OPENCAST_LOOKBACK_DAYS: ${OPENCAST_LOOKBACK_DAYS:-7}
      ANSEHBAR_SITE_CONFIG: ${ANSEHBAR_SITE_CONFIG:-}
      # Alarm e-mails (SMTP). Unset = Django defaults (see settings.py).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-ansehbar@localhost}
      ALARM_LANGUAGE: ${ALARM_LANGUAGE:-de}
      # Prometheus /metrics scrape token (unset = endpoint off / 404).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Fernet key for the stored GitLab token (empty = derived from the secret key).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Claim names — override only if the IdP uses non-standard ones.
      OIDC_CLAIM_USERNAME: ${OIDC_CLAIM_USERNAME:-preferred_username}
      OIDC_CLAIM_EMAIL: ${OIDC_CLAIM_EMAIL:-email}
      OIDC_CLAIM_FIRST_NAME: ${OIDC_CLAIM_FIRST_NAME:-given_name}
      OIDC_CLAIM_LAST_NAME: ${OIDC_CLAIM_LAST_NAME:-family_name}
      # Heal re-issued IdP subjects by username — only where the IdP never
      # re-assigns usernames (see basicbar-auth's operator notes). Default off.
      OIDC_MATCH_BY_USERNAME_FALLBACK: ${OIDC_MATCH_BY_USERNAME_FALLBACK:-0}
      # Optional AI features (LiteLLM). Off unless all four are set.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2000}
      AI_DISABLE_THINKING: ${AI_DISABLE_THINKING:-1}
      # Canonical language of authored content; optional LibreTranslate pre-fill.
      CONTENT_DEFAULT_LANGUAGE: ${CONTENT_DEFAULT_LANGUAGE:-de}
      CONTENT_TRANSLATION_PROVIDER: ${CONTENT_TRANSLATION_PROVIDER:-none}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - frontend_data:/shared_frontend
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # Periodic stream probe; same image and env as app, no ports, no uvicorn.
  monitor:
    image: ${ANSEHBAR_IMAGE:-ghcr.io/virtuos/ansehbar}:${ANSEHBAR_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ansehbar_monitor
    restart: unless-stopped
    # Wait until `app` has applied all migrations: on a fresh install (or an
    # update with new migrations) the monitor would otherwise query missing
    # tables. `migrate --check` exits non-zero while migrations are pending.
    command: >
      sh -c "until python manage.py migrate --check >/dev/null 2>&1;
      do echo 'waiting for migrations'; sleep 3; done;
      exec python manage.py run_monitor"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: ansehbar_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The Caddyfile is configured purely via these variables (no local edits).
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL (Let's Encrypt expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional: mount institutional TLS certificates (e.g. HARICA) when not
      # using Caddy's automatic Let's Encrypt; see docs/deployment.md.
      # - /etc/ansehbar/certs:/etc/caddy/certs:ro
      - frontend_data:/srv/www:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  static_data:
  media_data:
  frontend_data:
  caddy_data:
  caddy_config:
