# CI for the Uni Osnabrück GitLab. Three quick jobs: backend lint, backend
# tests (against a real PostgreSQL, as in production), frontend type-check +
# build. Add runner tags here if the instance's shared runners require them.
stages:
  - lint
  - test
  - build

backend-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check backend

backend-test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: ansehbar
    POSTGRES_USER: ansehbar
    POSTGRES_PASSWORD: ansehbar
    POSTGRES_HOST: postgres
  script:
    - pip install --quiet -r backend/requirements.txt
    - cd backend && python manage.py test

frontend-build:
  stage: build
  image: node:22-slim
  script:
    - cd frontend
    # npm ci once the lockfile is committed (reproducible, installs the
    # platform-specific optional deps reliably); plain install before that.
    - if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
    - npm run build
    - npm test
    - npm run check:i18n
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
