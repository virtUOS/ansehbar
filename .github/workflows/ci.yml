name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff==0.14.14
      - run: ruff check backend

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ansehbar
          POSTGRES_USER: ansehbar
          POSTGRES_PASSWORD: ansehbar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ansehbar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: ansehbar
      POSTGRES_USER: ansehbar
      POSTGRES_PASSWORD: ansehbar
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --quiet -r backend/requirements.txt
      - run: cd backend && python manage.py test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-fund --no-audit
      - run: cd frontend && npm run build
      - run: cd frontend && npm test
      - run: cd frontend && npm run check:i18n
