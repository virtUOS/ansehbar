# SPDX-License-Identifier: Apache-2.0
# Fails a pull request that adds or upgrades to a dependency with a known
# vulnerability of moderate severity or higher (GitHub Advisory Database).
# Needs the dependency graph (on by default for public repositories).
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
