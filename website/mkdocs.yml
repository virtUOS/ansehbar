# SPDX-License-Identifier: Apache-2.0
# Project website (GitHub Pages): landing page and guide — German, at the
# site root (English: mkdocs.en.yml, /en/).
# Build: mkdocs build --strict -f website/mkdocs.yml
site_name: ansehBAR
site_url: https://virtuos.github.io/ansehbar/
site_description: >-
  Live-Kontrolle der Vorlesungsaufzeichnung — Streams, Ton und Opencast-Termine
  aller Hörsäle auf einen Blick. Open Source von virtUOS, Universität Osnabrück.
site_author: Rüdiger Rolf, virtUOS, Universität Osnabrück
repo_url: https://github.com/virtUOS/ansehbar
repo_name: virtUOS/ansehbar
edit_uri: ""
copyright: >-
  © 2026 Universität Osnabrück (virtUOS) · ansehBAR steht unter der
  Apache-Lizenz 2.0

docs_dir: .
# Build output must live outside docs_dir (= this folder): repo-root site/.
site_dir: ../site
# The site sources live next to the config; keep build output and tooling
# out of the page tree.
exclude_docs: |
  README.md
  mkdocs.yml
  mkdocs.en.yml
  requirements.txt
  hooks/
  overrides/
  en/

theme:
  name: material
  language: de
  # Shared with mkdocs.en.yml: per-page language selector (partials/).
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Helles Design
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Design des Systems
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/ansehbar.css

hooks:
  - hooks/i18n.py

# Language selector. German lives at the site root, English under /en/
# (mkdocs.en.yml, built into site/en/). Links are relative to the site
# root; hooks/i18n.py points them at the counterpart of each page.
extra:
  alternate:
    - name: Deutsch
      link: ./
      lang: de
    - name: English
      link: en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    anchors: warn

nav:
  - Start: index.md
  - Anleitung:
      - anleitung/index.md
      - Anmelden: anleitung/anmelden.md
      - Übersicht: anleitung/uebersicht.md
      - Raumansicht: anleitung/raumansicht.md
      - Raumkalender: anleitung/kalender.md
      - Alarme: anleitung/alarme.md
      - Rekorder pflegen: anleitung/rekorder.md
      - Zugang und Einladungen: anleitung/zugang.md
      - Einstellungen: anleitung/einstellungen.md
  - Installation: installation.md
